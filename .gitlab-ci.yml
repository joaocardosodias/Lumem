stages:
  - lint
  - test
  - security
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2

lint_format:
  stage: lint
  image: golang:alpine
  before_script:
    - cd src/backend
  script:
    - test -z "$(gofmt -l .)"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

lint_vet:
  stage: lint
  image: golang:alpine
  before_script:
    - cd src/backend
  script:
    - go vet ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

test_suite:
  stage: test
  image: golang:alpine
  before_script:
    - cd src/backend
  script:
    - go test -v -coverpkg=./internal/... -coverprofile=coverage.out ./tests/...
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+.\d+\%)/'
  artifacts:
    expire_in: 7 days
    paths:
      - src/backend/coverage.out
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

security_audit:
  stage: security
  image: golang:alpine
  before_script:
    - cd src/backend
    - go install golang.org/x/vuln/cmd/govulncheck@latest
  script:
    - govulncheck ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

build_container:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker info
    - docker build -t "ghcr.io/$GHCR_USERNAME/g04-backend:$CI_COMMIT_SHORT_SHA" src/backend
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
    - docker push "ghcr.io/$GHCR_USERNAME/g04-backend:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "ghcr.io/$GHCR_USERNAME/g04-backend:$CI_COMMIT_SHORT_SHA" "ghcr.io/$GHCR_USERNAME/g04-backend:latest"
        docker push "ghcr.io/$GHCR_USERNAME/g04-backend:latest"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

pages:
  stage: deploy
  image: node:lts
  script:
    - cd docs
    - npm ci
    - npm run build
    - cd ..
    - rm -rf public
    - mv docs/dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
