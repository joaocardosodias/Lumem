stages:
  - lint
  - test
  - security
  - deploy

variables:
  DOCKER_DRIVER: overlay2

lint_format:
  stage: lint
  image: golang:alpine
  before_script:
    - cd src/backend
  script:
    - test -z "$(gofmt -l .)"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

lint_vet:
  stage: lint
  image: golang:alpine
  before_script:
    - cd src/backend
  script:
    - go vet ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

test_suite:
  stage: test
  image: golang:alpine
  before_script:
    - cd src/backend
  script:
    - go test -v -coverpkg=./internal/... -coverprofile=coverage.out ./tests/...
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+.\d+\%)/'
  artifacts:
    expire_in: 7 days
    paths:
      - src/backend/coverage.out
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

security_audit:
  stage: security
  image: golang:alpine
  before_script:
    - cd src/backend
    - go install golang.org/x/vuln/cmd/govulncheck@latest
  script:
    - govulncheck ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

pages:
  stage: deploy
  image: node:lts
  script:
    - cd docs
    - npm ci
    - npm run build
    - cd ..
    - rm -rf public
    - mv docs/dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
