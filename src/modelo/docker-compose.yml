services:
  ml-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-linha4
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    environment:
      TRAINING_JOB_DIR: /var/lib/g04/training-jobs
    volumes:
      - ml-training-jobs:/var/lib/g04/training-jobs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      default:
        aliases:
          - ml-service
          - ml-linha4

networks:
  default:
    name: backend-network
    external: true

volumes:
  ml-training-jobs:
