services:
  model-registry-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: model-registry-init-linha4
    restart: "no"
    env_file:
      - ../backend/.env
    environment: &ml-environment
      MINIO_ROOT_USER: ""
      MINIO_ROOT_PASSWORD: ""
      MODEL_REGISTRY_DRIVER: s3
      MODEL_S3_ENDPOINT: http://minio:9000
      MODEL_S3_REGION: us-east-1
      MODEL_S3_BUCKET: artefacts
      MODEL_S3_PREFIX: models/random-forest
      MODEL_MANIFEST_KEY: models/random-forest/active/manifest.json
      MODEL_TRAINING_BUCKET: training-data
      MODEL_PANEL_S3_KEY: datasets/current/painel.parquet
      MODEL_MAINTENANCE_S3_KEY: datasets/current/ZM01_limpa.xlsx
    command: ["python", "seed_local_registry.py"]
    healthcheck:
      disable: true
    volumes:
      - ml-model-artifacts:/app/artifacts
      - ../../models/modelo-5/painel.parquet:/bootstrap-training/painel.parquet:ro
      - ../../data/Corretiva Emergencial/processados/ZM01_limpa.xlsx:/bootstrap-training/ZM01_limpa.xlsx:ro

  ml-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-linha4
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    environment:
      <<: *ml-environment
      TRAINING_JOB_DIR: /var/lib/g04/training-jobs
    volumes:
      - ml-training-jobs:/var/lib/g04/training-jobs
      - ml-model-artifacts:/app/artifacts
    depends_on:
      model-registry-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      default:
        aliases:
          - ml-service
          - ml-linha4

networks:
  default:
    name: backend-network
    external: true

volumes:
  ml-training-jobs:
  ml-model-artifacts:
