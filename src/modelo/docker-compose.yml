services:
  ml-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-linha4
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - default

networks:
  default:
    name: backend-network
    external: true
