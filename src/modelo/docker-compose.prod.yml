services:
  ml-service:
    image: ${ACR_REGISTRY}/g04-ml-service:latest
    container_name: ml-linha4
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ../backend/.env
    environment:
      TRAINING_JOB_DIR: /var/lib/g04/training-jobs
    volumes:
      - ml-training-jobs:/var/lib/g04/training-jobs
      - ml-model-artifacts:/app/artifacts
      - ../../models/modelo-5/painel.parquet:/app/training-data/painel.parquet:ro
      - ../../data/Corretiva Emergencial/processados/ZM01_limpa.xlsx:/app/training-data/ZM01_limpa.xlsx:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: backend-network
    external: true

volumes:
  ml-training-jobs:
  ml-model-artifacts:
