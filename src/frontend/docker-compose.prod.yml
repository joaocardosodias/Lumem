services:
  frontend:
    image: ${ACR_REGISTRY}/g04-frontend:latest
    container_name: frontend-linha4
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      default:
        aliases:
          - frontend

networks:
  default:
    name: backend-network
    external: true
