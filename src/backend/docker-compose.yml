services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio-linha4
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio-init-linha4
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
      MINIO_APP_USER: ${MINIO_APP_USER:?defina MINIO_APP_USER no .env}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?defina MINIO_APP_PASSWORD no .env}
    volumes:
      - ./minio/app-policy.json:/config/app-policy.json:ro
    entrypoint: >-
      /bin/sh -c '
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
      mc mb --ignore-existing local/ingestion-uploads;
      mc mb --ignore-existing local/training-data;
      mc mb --ignore-existing local/artefacts;
      mc anonymous set none local/ingestion-uploads;
      mc anonymous set none local/training-data;
      mc anonymous set none local/artefacts;
      mc admin user add local "$${MINIO_APP_USER}" "$${MINIO_APP_PASSWORD}" || true;
      mc admin policy create local g04-app /config/app-policy.json || true;
      mc admin policy attach local g04-app --user "$${MINIO_APP_USER}";
      '
    depends_on:
      - minio

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: backend-linha4
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ""
      MINIO_ROOT_PASSWORD: ""
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ingestion-uploads
      S3_ACCESS_KEY_ID: ${MINIO_APP_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_APP_PASSWORD}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      MIGRATIONS_PATH: /app/migrations
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      VPS_MODEL_URL: http://ml-linha4:8000
    cpus: ${LOAD_TEST_CPUS:-0}
    mem_limit: ${LOAD_TEST_MEMORY:-0}
    volumes:
      - ingestion-tmp:/tmp
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: worker-linha4
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ""
      MINIO_ROOT_PASSWORD: ""
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ingestion-uploads
      S3_ACCESS_KEY_ID: ${MINIO_APP_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_APP_PASSWORD}
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    volumes:
      - ingestion-tmp:/tmp
    depends_on:
      backend:
        condition: service_healthy
      otel-collector:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter-linha4
    restart: unless-stopped
    expose:
      - "9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host/root'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-linha4
    restart: unless-stopped
    expose:
      - "9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
      - node-exporter
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-linha4
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:latest
    container_name: loki-linha4
    restart: unless-stopped
    expose:
      - "3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-storage:/loki
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  promtail:
    image: grafana/promtail:latest
    container_name: promtail-linha4
    restart: unless-stopped
    user: "0:0"
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tempo:
    image: grafana/tempo:3.0.0
    container_name: tempo-linha4
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    expose:
      - "3200"
      - "4317"
    volumes:
      - ./tempo/tempo-config.yml:/etc/tempo/tempo.yml:ro
      - tempo-storage:/var/tempo
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    container_name: otel-collector-linha4
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    expose:
      - "4317"
      - "4318"
    volumes:
      - ./otel-collector/otel-collector-config.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on:
      - tempo
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: nginx-linha4
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - grafana
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  minio-data:
  grafana-storage:
  loki-storage:
  tempo-storage:
  ingestion-tmp:

networks:
  default:
    name: backend-network
    external: true
